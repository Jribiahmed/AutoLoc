spring.application.name=autoloc.api

# Connexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_associations_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${AUTOLOC_DB_PASSWORD}

# Hibernate et JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO